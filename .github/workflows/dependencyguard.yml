name: DependencyGuard

on:
  pull_request:
    paths:
      - package-lock.json

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependencyguard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DG_MAX_PACKAGES: ${{ vars.DEPENDENCYGUARD_MAX_PACKAGES || '25' }}
      DG_FAIL_ON: ${{ vars.DEPENDENCYGUARD_FAIL_ON || '' }}
    steps:
      # Run the trusted base implementation; the proposed checkout is data only.
      - name: Check out base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out proposed lockfile data
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .dependencyguard/pr
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install base revision tools
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false --no-save
          fi

      # The script reads both commits with git show; no PR package code is run.
      - name: Analyze pull request and update comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --conditions=react-server --import tsx scripts/github-action.ts

      - name: Analyze fork pull request (summary only)
        if: github.event.pull_request.head.repo.full_name != github.repository
        env:
          DG_SUMMARY_ONLY: "true"
        run: node --conditions=react-server --import tsx scripts/github-action.ts
